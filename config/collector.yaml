serial:
  device: "/dev/ttyUSB0"
  baudrate: 2400

meters:
  - address: "000000000005"
    name: "1号电表"
  - address: "000000000002"
    name: "2号电表"

data_items:
  - di: "00010000"
    name: "正向有功总电能"
    length: 4
    decimal: 2
    unit: "kWh"
  - di: "00020000"
    name: "反向有功总电能"
    length: 4
    decimal: 2
    unit: "kWh"
  - di: "02010100"
    name: "A相电压"
    length: 2
    decimal: 1
    unit: "V"
  - di: "02020100"
    name: "A相电流"
    length: 3
    decimal: 3
    unit: "A"

poll_interval_seconds: 60
