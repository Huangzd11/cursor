# 根级 serial 可选：作为各电表 meters[].serial 的默认值（表级未写 device 时继承）
# serial:
#   device: "/dev/plugin/ttyRS0_2"
#   baudrate: 2400

meters:
  - address: "000000000005"
    name: "meter-1"
    enabled: true
    serial:
      device: "/dev/plugin/ttyRS0_2"
      baudrate: 2400
  - address: "000000000002"
    name: "meter-2"
    enabled: false
    serial:
      device: "/dev/plugin/ttyRS0_3"
      baudrate: 2400

data_items:
  - di: "00010000"
    name: "ActiveTotalE"  # 正向有功总电能
    enabled: true
    length: 4
    decimal: 2
    unit: "kWh"
  - di: "00020000"
    name: "ReverseTotalE"  # 反向有功总电能
    enabled: true
    length: 4
    decimal: 2
    unit: "kWh"
  - di: "02010100"
    name: "curU"  # 电流
    enabled: true
    length: 2
    decimal: 1
    unit: "V"
  - di: "02020100"
    name: "curI"  # 电流
    enabled: true
    length: 3
    decimal: 3
    unit: "A"
  - di: "02030100"
    name: "TempWatt"  # 瞬时总有功功率
    enabled: true
    length: 3
    decimal: 4
    unit: "kW"
  - di: "02050100"
    name: "showTempWatt"  # 瞬时总有功功率
    enabled: true
    length: 3
    decimal: 4
    unit: "kVA"
  - di: "02060100"
    name: "factor"  # 功率因数
    enabled: true
    length: 2
    decimal: 3
    unit: ""  # 无单位

poll_interval_seconds: 120

# MQTT 上报（详见 document/mqtt-reporting-plan.md）
mqtt:
  enabled: true
  gateway_id: "gw-openwrt-01"  # 网关ID
  broker: "127.0.0.1"  # 代理地址
  port: 1883  # 代理端口
  tls: false  # 是否使用TLS
  # ca_file: "/etc/ssl/certs/ca.crt"
  # username: ""  # 用户名
  # password: ""  # 密码
  # client_id: "dlt645-gw-01"  # 客户端ID
  topic_prefix: "dlt645"  # 主题前缀
  qos: 1  # 质量保证
  keepalive_sec: 60  # 心跳时间
  max_queue: 512  # 最大队列长度
